<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Naropa &amp; Nalanda Globe</title>
    <style>
      /* A single dark "night sky" look: floating glass panels over the globe. */
      :root {
        --space: #02030a;
        --panel: rgba(12, 16, 28, 0.86);
        --panel-edge: rgba(255, 255, 255, 0.08);
        --control: #1b2236;
        --control-edge: #2c3550;
        --text: #e6e9f0;
        --muted: #a9b1c4;
        --faint: #7d869b;
        --accent: #2d5bd7;
        --label-shadow: #000;
        --gutter: 16px;
        --top: calc(var(--gutter) + env(safe-area-inset-top, 0px));
        --bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px));
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--space); }
      body { font: 13px/1.4 system-ui, sans-serif; color: var(--text); }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }

      .glass {
        background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      }
      .panel {
        position: fixed; top: var(--top); left: var(--gutter);
        width: min(250px, calc(100vw - 2 * var(--gutter) - 2px));
        max-height: calc(100% - var(--top) - var(--bottom) - 60px); overflow-y: auto;
        padding: 12px 14px; box-sizing: border-box;
      }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .panel h1 { font-size: 15px; margin: 0; font-weight: 600; }
      #toggle-panel { padding: 4px 10px; }
      .panel[data-collapsed="true"] .panel-body { display: none; }
      .panel label { display: block; margin: 10px 0 4px; color: var(--muted); }
      .row { display: flex; gap: 6px; }
      .row input[type=text] { flex: 1; min-width: 0; }
      input[type=text], select, button {
        font: inherit; color: inherit; background: var(--control);
        border: 1px solid var(--control-edge); border-radius: 6px; padding: 6px 8px;
      }
      select { max-width: 100%; }
      input[type=range] { width: 100%; }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { width: 100%; margin-top: 12px; background: var(--accent); border-color: var(--accent); }
      .toggles { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
      .toggles label { display: flex; align-items: center; gap: 5px; margin: 0; color: inherit; }
      #status { margin-top: 10px; color: var(--faint); font-size: 12px; }
      .note { margin-top: 8px; color: var(--faint); font-size: 11px; }
      .muted { color: var(--muted); }

      .labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap;
        text-shadow: 0 0 3px var(--label-shadow), 0 0 6px var(--label-shadow);
      }
      .label span { margin-left: 4px; font-weight: 400; opacity: 0.7; font-size: 10px; }
      .label.founding { font-size: 14px; letter-spacing: 0.04em; }

      #legend {
        position: fixed; right: var(--gutter); top: var(--top);
        max-height: calc(100% - var(--top) - var(--bottom) - 140px); overflow: auto;
        padding: 8px 12px; font-size: 12px;
      }
      #legend summary { cursor: pointer; color: var(--muted); }
      #legend-items { margin-top: 6px; }
      #legend-items div { display: flex; align-items: center; gap: 6px; line-height: 1.7; }
      #legend-items i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

      #info {
        position: fixed; right: var(--gutter); bottom: var(--bottom); min-width: 180px;
        padding: 10px 12px; pointer-events: none;
      }

      /* Phones: smaller labels; the readout spans the bottom. */
      @media (max-width: 600px) {
        .label { font-size: 10px; }
        .label span { display: none; }
        .label.founding { font-size: 12px; }
        #info { left: var(--gutter); min-width: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="panel glass" id="panel" data-collapsed="false">
      <div class="panel-head">
        <h1>Naropa &amp; Nalanda</h1>
        <button id="toggle-panel" type="button" aria-controls="panel-body" aria-expanded="true">Hide</button>
      </div>
      <div class="panel-body" id="panel-body">
        <label for="world">World</label>
        <select id="world">
          <option value="naropa-nalanda" selected>Naropa &amp; Nalanda</option>
          <option value="random">Random (seeded)</option>
        </select>

        <div id="atlas-controls">
          <label for="view">Map view</label>
          <select id="view">
            <option value="terrain">Terrain</option>
            <option value="nations">Modern nations (19)</option>
            <option value="founding">Founding nations (5)</option>
          </select>
          <label for="gap">Move Naropa west: <span id="gap-value"></span></label>
          <input id="gap" type="range" min="0" max="40" step="1" value="15" />
          <div class="note" id="gap-km"></div>

          <label for="natural">Natural shapes: <span id="natural-value"></span></label>
          <input id="natural" type="range" min="0" max="2" step="0.1" value="1" />

          <div class="toggles">
            <label><input id="draft" type="checkbox" checked /> Draft lands west of Naropa</label>
          </div>
          <div class="note">Coastlines, borders, terrain and rivers from the hand-drawn map. Heights are rough placeholders per terrain type. 0° and "as drawn" show the map exactly as drawn.</div>
        </div>

        <div id="random-controls" hidden>
          <label for="seed">Seed</label>
          <div class="row">
            <input id="seed" type="text" spellcheck="false" />
            <button id="random-seed" type="button" title="Random seed">🎲</button>
          </div>

          <label for="sea-level">Sea level</label>
          <input id="sea-level" type="range" min="-0.3" max="0.3" step="0.01" value="0" />

          <label for="continent-scale">Continent size (left = larger)</label>
          <input id="continent-scale" type="range" min="0.6" max="2.5" step="0.05" value="1.2" />

          <label for="mountains">Mountains</label>
          <input id="mountains" type="range" min="0" max="1.2" step="0.05" value="0.6" />
        </div>

        <label for="detail">Mesh detail</label>
        <select id="detail">
          <option value="48">Low</option>
          <option value="96">Medium</option>
          <option value="160" selected>High</option>
          <option value="256">Very high (slower)</option>
        </select>

        <div class="toggles">
          <label><input id="labels" type="checkbox" checked /> Labels</label>
          <label><input id="rivers" type="checkbox" checked /> Rivers</label>
          <label><input id="grid" type="checkbox" /> Grid</label>
          <label><input id="rotate" type="checkbox" /> Rotate</label>
        </div>

        <button id="generate" type="button" class="primary">Generate</button>
      </div>
      <div id="status"></div>
    </div>

    <details id="legend" class="glass" hidden>
      <summary id="legend-title">Legend</summary>
      <div id="legend-items"></div>
    </details>
    <div id="info" class="glass" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
