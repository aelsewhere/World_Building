<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Map</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; }
      body { font: 13px/1.4 system-ui, sans-serif; color: #e6e9f0; }
      #app { position: fixed; inset: 0; }
      .panel {
        position: fixed; top: 16px; left: 16px; width: 240px;
        padding: 14px; border-radius: 10px;
        background: rgba(12, 16, 28, 0.82); border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(6px);
      }
      .panel h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
      .panel label { display: block; margin: 10px 0 4px; color: #a9b1c4; }
      .row { display: flex; gap: 6px; }
      .row input[type=text] { flex: 1; min-width: 0; }
      input[type=text], select, button {
        font: inherit; color: inherit; background: #1b2236;
        border: 1px solid #2c3550; border-radius: 6px; padding: 5px 8px;
      }
      input[type=range] { width: 100%; }
      button { cursor: pointer; }
      button.primary { width: 100%; margin-top: 12px; background: #2d5bd7; border-color: #2d5bd7; }
      .toggles { display: flex; gap: 14px; margin-top: 10px; }
      .toggles label { display: flex; align-items: center; gap: 5px; margin: 0; color: inherit; }
      #status { margin-top: 10px; color: #7d869b; font-size: 12px; }
      .labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
        text-shadow: 0 0 3px #000, 0 0 6px #000;
      }
      .label span { margin-left: 4px; font-weight: 400; opacity: 0.7; font-size: 10px; }
      .label.founding { font-size: 14px; letter-spacing: 0.04em; }
      .muted { color: #a9b1c4; }
      #legend {
        position: fixed; right: 16px; top: 16px; max-height: calc(100vh - 160px); overflow: auto;
        padding: 10px 12px; border-radius: 8px; font-size: 12px;
        background: rgba(12, 16, 28, 0.82); border: 1px solid rgba(255, 255, 255, 0.08);
      }
      #legend div { display: flex; align-items: center; gap: 6px; line-height: 1.7; }
      #legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
      .toggles { flex-wrap: wrap; }
      .note { margin-top: 8px; color: #7d869b; font-size: 11px; }
      #info {
        position: fixed; right: 16px; bottom: 16px; min-width: 180px;
        padding: 10px 12px; border-radius: 8px;
        background: rgba(12, 16, 28, 0.82); border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="panel">
      <h1>World Map</h1>
      <label for="world">World</label>
      <select id="world">
        <option value="naropa-nalanda" selected>Naropa &amp; Nalanda</option>
        <option value="random">Random (seeded)</option>
      </select>

      <div id="atlas-controls">
        <label for="view">Map view</label>
        <select id="view">
          <option value="terrain">Terrain</option>
          <option value="nations">Modern nations (19)</option>
          <option value="founding">Founding nations (5)</option>
        </select>
        <label for="gap">Move Naropa west: <span id="gap-value"></span></label>
        <input id="gap" type="range" min="0" max="40" step="1" value="15" />
        <div class="note" id="gap-km"></div>
        <div class="note">Coastlines, borders, terrain and rivers from the hand-drawn map. Heights are rough placeholders per terrain type. 0° is the map as drawn.</div>
      </div>

      <div id="random-controls" hidden>
        <label for="seed">Seed</label>
        <div class="row">
          <input id="seed" type="text" spellcheck="false" />
          <button id="random-seed" title="Random seed">🎲</button>
        </div>

        <label for="sea-level">Sea level</label>
        <input id="sea-level" type="range" min="-0.3" max="0.3" step="0.01" value="0" />

        <label for="continent-scale">Continent size (left = larger)</label>
        <input id="continent-scale" type="range" min="0.6" max="2.5" step="0.05" value="1.2" />

        <label for="mountains">Mountains</label>
        <input id="mountains" type="range" min="0" max="1.2" step="0.05" value="0.6" />
      </div>

      <label for="detail">Mesh detail</label>
      <select id="detail">
        <option value="48">Low</option>
        <option value="96">Medium</option>
        <option value="160" selected>High</option>
      </select>

      <div class="toggles">
        <label><input id="labels" type="checkbox" checked /> Labels</label>
        <label><input id="rivers" type="checkbox" checked /> Rivers</label>
        <label><input id="grid" type="checkbox" /> Grid</label>
        <label><input id="rotate" type="checkbox" /> Rotate</label>
      </div>

      <button id="generate" class="primary">Generate</button>
      <div id="status"></div>
    </div>

    <div id="legend" hidden></div>
    <div id="info" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
